<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Claude</title>
  <link rel="stylesheet" href="chat.css">
  <!-- A host may set window.CHAT_STRINGS (the page's words) and
       window.CHAT_OPTIONS here, before chat.js. See README. -->
</head>
<body>
  <div id="list"></div>
  <div id="composer">
    <div class="box">
      <textarea id="input" rows="1"></textarea>
      <div id="bar">
        <span id="status"></span>
        <button id="stop" class="round"><svg viewBox="0 0 16 16"><rect x="4" y="4" width="8" height="8" rx="1.5" fill="currentColor"/></svg></button>
        <button id="send" class="round"><svg viewBox="0 0 16 16"><path d="M8 13V3.5M3.5 8 8 3.5 12.5 8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </div>
    </div>
  </div>
  <script src="vendor/marked.js"></script>
  <script src="vendor/purify.js"></script>
  <script src="bridge.js"></script>
  <script src="chat.js"></script>
</body>
</html>
